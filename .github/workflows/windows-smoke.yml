name: Windows compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    name: Java 25, Gradle, Paper and SQLite on Windows x64
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests and build with the Windows Gradle wrapper
        shell: cmd
        run: gradlew.bat clean test build --no-daemon

      - name: Start Paper and verify plugin plus SQLite
        shell: pwsh
        run: .\scripts\smoke-test-windows.ps1

      - name: Upload Windows-tested plugin
        uses: actions/upload-artifact@v6
        with:
          name: windows-tested-plugin-${{ github.sha }}
          path: build/libs/AllAndOnlyChests-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload Paper logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-paper-smoke-logs
          path: |
            build/windows-smoke-server/logs/latest.log
            build/windows-smoke-server/windows-smoke-console.log
          if-no-files-found: warn
