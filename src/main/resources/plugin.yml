name: AllAndOnlyChests
version: '0.1.0-SNAPSHOT'
main: dev.playmonkeei.allandonlychests.AllAndOnlyChestsPlugin
api-version: '26.1'
description: All and Only Chests challenge for Paper
author: playmonkeei

commands:
  gui:
    description: Öffnet die Strukturübersicht.
    usage: /gui
    permission: allandonlychests.command.gui
  structurecomplete:
    description: Markiert eine Struktur zu Testzwecken als abgeschlossen.
    usage: /structurecomplete <Kategorie>
    permission: allandonlychests.command.structurecomplete

permissions:
  allandonlychests.command.gui:
    description: Erlaubt das Öffnen der Strukturübersicht.
    default: true
  allandonlychests.command.structurecomplete:
    description: Erlaubt das testweise Abschließen einer Struktur.
    default: op
