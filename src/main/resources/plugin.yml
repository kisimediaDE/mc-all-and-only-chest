name: AllAndOnlyChests
version: '0.1.0-SNAPSHOT'
main: dev.playmonkeei.allandonlychests.AllAndOnlyChestsPlugin
api-version: '26.1'
description: All and Only Chests challenge for Paper
author: playmonkeei

commands:
  gui:
    description: Öffnet die Strukturübersicht.
    usage: /gui
    permission: allandonlychests.command.gui
  structurecomplete:
    description: Markiert eine Struktur zu Testzwecken als abgeschlossen.
    usage: /structurecomplete <Kategorie|all>
    permission: allandonlychests.command.structurecomplete
  structurereset:
    description: Setzt den Fortschritt einer Struktur nach Bestätigung zurück.
    usage: /structurereset <Kategorie> confirm
    permission: allandonlychests.command.structurereset
  structures:
    description: Zeigt den Gesamtfortschritt aller Strukturen.
    usage: /structures
    permission: allandonlychests.command.structures
  reset:
    description: Setzt nach Bestätigung alle Plugin-Fortschrittsdaten zurück.
    usage: /reset confirm
    permission: allandonlychests.command.reset
  chesthud:
    description: Blendet die Challenge-Anzeige ein oder aus.
    usage: /chesthud
    permission: allandonlychests.command.chesthud

permissions:
  allandonlychests.command.gui:
    description: Erlaubt das Öffnen der Strukturübersicht.
    default: true
  allandonlychests.command.structurecomplete:
    description: Erlaubt das testweise Abschließen einer Struktur.
    default: op
  allandonlychests.command.structurereset:
    description: Erlaubt das gezielte Zurücksetzen einer Struktur.
    default: op
  allandonlychests.command.structures:
    description: Erlaubt das Anzeigen des Gesamtfortschritts.
    default: true
  allandonlychests.command.reset:
    description: Erlaubt das vollständige Zurücksetzen der Challenge-Daten.
    default: op
  allandonlychests.command.chesthud:
    description: Erlaubt das Umschalten der Challenge-Anzeige.
    default: true
